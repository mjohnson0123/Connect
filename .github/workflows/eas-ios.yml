name: Build iOS (EAS)

# Manually triggered: Actions tab → "Build iOS (EAS)" → Run workflow.
#
# Prerequisites (one-time, beyond the Android setup):
#   1. Apple Developer Program membership ($99/yr) — Apple requires it to
#      sign any build that runs on a real iPhone.
#   2. Connect Apple credentials to EAS: expo.dev → project → Credentials →
#      iOS → add an App Store Connect API key (lets CI sign non-interactively).
#   3. Uses the same EXPO_TOKEN repository secret as the Android workflow.
#
# Distribution: iPhones can't sideload — after a successful build, submit to
# TestFlight (eas submit -p ios) and install via the TestFlight app.
on:
  workflow_dispatch:

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check EXPO_TOKEN is configured
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is missing. Add it at Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Start iOS build
        run: eas build --platform ios --profile production --non-interactive --no-wait
