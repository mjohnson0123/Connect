name: Build Android APK (EAS)

# Manually triggered: Actions tab → "Build Android APK (EAS)" → Run workflow.
# Requires an EXPO_TOKEN repository secret (expo.dev → Account settings →
# Access tokens). The build itself runs on Expo's servers; watch progress and
# download the APK from the project's Builds page on expo.dev.
on:
  workflow_dispatch:

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check EXPO_TOKEN is configured
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is missing. Add it at Settings → Secrets and variables → Actions → 'New repository secret' (the Secrets tab, not Variables). Name must be exactly EXPO_TOKEN; value comes from https://expo.dev/settings/access-tokens"
            exit 1
          fi
          echo "EXPO_TOKEN is set."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Link or create the EAS project
        run: eas init --non-interactive --force

      - name: Start Android APK build
        run: eas build --platform android --profile preview --non-interactive --no-wait
